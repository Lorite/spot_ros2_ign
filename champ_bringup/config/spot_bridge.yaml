- ros_topic_name: "/model/coke_can/pose"
  gz_topic_name: "/model/coke_can/pose"
  ros_type_name: "geometry_msgs/msg/TransformStamped"
  gz_type_name: "gz.msgs.Pose" 
#  lazy: true
  direction: GZ_TO_ROS

- ros_topic_name: "/model/spot/pose"
  gz_topic_name: "/model/spot/pose"
  ros_type_name: geometry_msgs/msg/TransformStamped # geometry_msgs/msg/TransformStamped "geometry_msgs/msg/Pose"
  gz_type_name: "gz.msgs.Pose" 
#  lazy: true
  direction: GZ_TO_ROS

# Real-topic schema bridges for front-left camera (align with Spot wrapper)
# RGB image
- ros_topic_name: "/camera/frontleft/image"
  gz_topic_name: "/frontleft_fisheye"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera info (if provided by gz-sensors; topic is typically <rgb_topic>/camera_info)
- ros_topic_name: "/camera/frontleft/camera_info"
  gz_topic_name: "/frontleft_fisheye/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Depth image (registered depth equivalent)
- ros_topic_name: "/depth_registered/frontleft/image"
  gz_topic_name: "/frontleft_depth"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera info for depth camera
- ros_topic_name: "/depth_registered/frontleft/camera_info"
  gz_topic_name: "/frontleft_depth/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
